<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>모닝브리프</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="daydate" id="daydate">불러오는 중…</div>
    <h1 class="headline" id="headline">모닝브리프</h1>
    <div class="weather-strip" id="weather-strip" hidden></div>
  </div>
</header>

<main class="wrap">
  <section id="must-know" hidden>
    <h2 class="sect">반드시 알아야 할 것</h2>
    <ol class="items" id="must-know-list"></ol>
  </section>

  <nav class="tabs" id="tabs" aria-label="모듈"></nav>
  <section id="panel"></section>
</main>

<footer class="wrap foot">
  <div class="status" id="status"></div>
  <div class="tiny">공개 데이터만 싣습니다 · 개인 정보 없음 · 링크는 원문으로 갑니다</div>
</footer>

<script src="app.js"></script>
</body>
</html>
